# Pepper Hunter WATCHES - 7 watch kiem tien cua PepperResearch (Synmerco,
# CC0, MoltJobs, Owockibot, Fiverr, Boards, Seller inbox) port tu cron agent
# Muse o tab kiem tien sang GitHub Actions (10/11/2026) - chung nha voi
# Worker Hunter + DOER trong repo pepper-hunter-cron.
#
# Vong lap tu noi kieu DOER: job chay ~330 phut, moi 60s 1 vong, gan het
# gio tu workflow_dispatch run moi bang gh CLI. Schedule */5 chi la du
# phong danh thuc khi chuoi dut; concurrency group chan 2 job trung.
#
# Secrets dung (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID  (da co san tu he Hunter)
#   SYNMERCO_API_KEY    key agent Synmerco (thieu -> watch Synmerco cho)
#   MOLTJOBS_API_KEY    key agent MoltJobs (thieu -> chi stats chay)
#   CC0_CF_API_TOKEN    token Cloudflare doc KV cc0-jobs (thieu -> cho)
# Fiverr + Seller inbox khong nam o day: cho Luân consent Gmail OAuth
# (giai doan 2).
name: Pepper Hunter Watches

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pepper-hunter-watches
  cancel-in-progress: false

jobs:
  watches:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chay watches (vong lap tu noi ~330 phut)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNMERCO_API_KEY: ${{ secrets.SYNMERCO_API_KEY }}
          MOLTJOBS_API_KEY: ${{ secrets.MOLTJOBS_API_KEY }}
          CC0_CF_API_TOKEN: ${{ secrets.CC0_CF_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 watches/watch.py
