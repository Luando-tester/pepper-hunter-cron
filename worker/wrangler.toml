# Pepper Hunter Worker - RUNNER CHINH chay dinh ky (thay GitHub Actions cron
# de tiet kiem phut Actions; Worker free cua Cloudflare co cron trigger).
#
# DEPLOY (agent chinh se dieu phoi qua connector Cloudflare Workers sau;
# neu lam tay bang wrangler thi chay tu thu muc worker/):
#   1) Tao KV namespace cho chong trung:
#        wrangler kv namespace create SEEN
#      -> dien id tra ve vao muc [[kv_namespaces]] ben duoi (thay GIA_TRI_ID).
#   2) Dat secrets (KHONG ghi gia tri vao file nay hay vao repo):
#        wrangler secret put GEMINI_API_KEYS
#          -> POOL toi da 10 key Gemini trong 1 gia tri: dan cac key ngan cach
#             bang dau phay (key1,key2,key3) hoac moi key 1 dong. Worker xoay
#             vong giong tool local: 429 het quota -> doi model/key ke;
#             400/401/403 key chet -> bo key do trong vong chay.
#             (Van tuong thich GEMINI_API_KEY cu: chi co bien do thi pool = 1 key.)
#        wrangler secret put TELEGRAM_BOT_TOKEN
#        wrangler secret put TELEGRAM_CHAT_ID
#   3) Deploy: wrangler deploy
#   4) Test: mo https://pepper-hunter.<subdomain>.workers.dev/ xem trang thai,
#      roi /run de chay thu 1 vong.

name = "pepper-hunter"
main = "worker.js"
compatibility_date = "2024-11-01"

# Lich dinh ky: MOI PHUT (Luân chot 17:59 10/11) - Worker ganh het, Actions
# chi chay workflow_dispatch. Lich that dat bang schedules API cua Cloudflare,
# muc nay chi de tai lieu khop.
[triggers]
crons = ["* * * * *"]

# Chong trung keo: key = "url:<link issue>", value = thoi diem thay lan dau
[[kv_namespaces]]
binding = "SEEN"
id = "GIA_TRI_ID_KV_SEEN_SE_DIEN_KHI_DEPLOY"
